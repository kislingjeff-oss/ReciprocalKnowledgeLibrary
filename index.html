<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reciprocal Knowledge Library</title>
<meta name="description" content="Browse, search and export Jeff Kisling's writing: channels into knowledge, reciprocity and extraction, Quakers and Indigenous peoples.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* The Journal Research Desk's theme: cool paper, prairie green, one light mode. */
:root{
  --paper:#f7f9f8;
  --card:#ffffff;
  --mist:#eaf1ef;
  --line:#d8e2df;
  --ink:#000000;
  --ink-2:#000000;
  --ink-3:#2b2b2b;
  --accent:#2f6b5e;
  --accent-2:#e3efe9;
  --sky:#e6eef6;
  --mark:#fbeeb8;
  --font-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  --shadow:0 1px 2px rgba(29,42,44,.06),0 4px 14px rgba(29,42,44,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font:16px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7fb3a5;outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}

header.top{background:var(--card)}
.sticky-top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.brand{padding-block:20px 12px}
.brand-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
.brand h1{margin:0;font:600 clamp(1.4rem,3vw,2rem)/1.15 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:.95rem;max-width:none}
/* tighten the header once the page is scrolled, so the sticky bar stays small */
.sticky-top.scrolled .brand{padding-block:9px 7px}
.sticky-top.scrolled .brand p{display:none}
.sticky-top.scrolled .brand h1{font-size:1.1rem}
.sticky-top.scrolled .stat b{font-size:.95rem}
.sticky-top.scrolled .stat span{display:none}
.sticky-top.scrolled .stat{display:flex;align-items:baseline;gap:5px}
.sticky-top.scrolled .stat::after{content:attr(data-label);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.brand,.tablist,.stat b,.stat span{transition:all .12s ease-out}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{display:block;font:600 1.15rem/1.1 var(--font-ui)}
.stat span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

nav.tabs{overflow:hidden;background:var(--card);border-top:1px solid var(--line)}
.tablist{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tablist::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:12px 14px 11px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;flex:none}
a.tab{text-decoration:none}
.tab:hover{color:var(--accent)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.count-pill{min-width:22px;padding:1px 7px;border-radius:999px;background:var(--mist);color:var(--ink-2);font-size:.75rem;font-variant-numeric:tabular-nums;text-align:center}
.tab[aria-selected="true"] .count-pill{background:var(--accent);color:#fff}

main{padding-block:24px 56px}
h2.ph{font:600 1.35rem/1.2 var(--font-ui);margin:0 0 4px}
.lede{color:var(--ink-2);margin:0 0 18px;max-width:68ch}
.hint{font-size:.8rem;color:var(--ink-3);margin:0}
.search-hint{margin:-6px 0 12px}

.searchbar{display:flex;gap:8px;margin-bottom:14px}
.searchbar .input{font-size:1.05rem;padding:12px 14px}
.input,.select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px}
.input:focus,.select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-2)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 13px;font-weight:600;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#285c51}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.search-grid{display:grid;grid-template-columns:minmax(440px,38%) minmax(0,1fr);gap:24px;align-items:start}
/* Below this width the panel moves above the results, still in columns, so it never needs its own scrollbar. */
@media (max-width:1100px){.search-grid{grid-template-columns:minmax(0,1fr)}.filters{position:static!important}}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
/* two columns inside the panel, so the whole of it is visible at once */
.filters-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;align-items:start}
@media (max-width:620px){.filters-body{grid-template-columns:minmax(0,1fr)}}
.fcol{display:grid;gap:10px;align-content:start;min-width:0}
.filters .check{padding:3px 7px;font-size:.87rem;line-height:1.3}
.filters .seclist .n{font-size:.75rem}
.filters .subhead{margin:5px 0 0 7px}
.filters summary{display:none}
@media (max-width:860px){.filters{padding:0}.filters summary{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:600;cursor:pointer;list-style:none}.filters summary::-webkit-details-marker{display:none}.filters summary::after{content:"Show";color:var(--accent);font-size:.88rem}.filters details[open] summary::after{content:"Hide"}.filters-body{padding:0 16px 16px}}
@media (min-width:1101px){.filters{position:sticky;top:calc(var(--top,150px) + 12px)}}
/* only on a window too short for the panel does it scroll, so nothing is unreachable */
@media (min-width:1101px) and (max-height:700px){.filters{max-height:calc(100dvh - var(--top,150px) - 28px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.field{display:grid;gap:6px}
.label{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.btn.tiny{padding:1px 7px;font-size:.7rem;letter-spacing:.04em;border-radius:6px;margin-left:auto}
.btn.tiny+.btn.tiny{margin-left:0}
.seclist .check .dot{margin-right:-2px}
.seclist{display:grid;gap:1px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;padding:5px 7px;border-radius:6px;cursor:pointer;width:100%;text-align:left;border:0;background:none;color:inherit}
.check:hover{background:var(--mist)}
.check[aria-current="true"]{background:var(--accent);color:#fff;font-weight:600}
.check .n{margin-left:auto;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.check[aria-current="true"] .n{color:#e6f0ec}
.check.sub{padding-left:20px}
.check input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.subhead{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:8px 0 1px 7px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.toolbar .summary{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.toolbar .summary b{color:var(--ink)}

.results{display:grid;gap:10px}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.result.is-selected{background:var(--sky);border-color:#bfd1e2}
.result .pick{padding-top:4px}
.result .pick input{accent-color:var(--accent);width:18px;height:18px;cursor:pointer}
.result h3{margin:0;font:700 1.08rem/1.35 var(--font-ui)}
.result h3 a{color:var(--ink);text-decoration:none}
.result h3 a:hover{color:var(--accent);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.blog-tag{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.result h3,.result .sum,.chip{overflow-wrap:anywhere}
.result .sum{grid-column:2;margin:6px 0 0;font:400 1rem/1.6 var(--font-ui);max-width:120ch}
.result .sum.empty{font:italic .92rem/1.5 var(--font-ui);color:var(--ink-3)}
.tags{grid-column:2;display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tagbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:1px 9px;font-size:.76rem;color:var(--ink-2);cursor:pointer}
.tagbtn:hover{border-color:var(--accent);color:var(--accent)}
.tagbtn.sec{background:var(--accent-2);border-color:#bcd8cd}
.agebadge{display:inline-block;padding:0 8px;border-radius:999px;background:#e6eef6;border:1px solid #bfd1e2;color:#000;font-weight:600;font-size:.76rem}
.agebadge.none{background:var(--mist);border-color:var(--line)}
.themes{grid-column:2;font-size:.82rem;margin-top:6px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty-state{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2)}
.pager{display:flex;justify-content:center;margin-top:20px}

/* Reader */
article.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;overflow-wrap:anywhere;box-shadow:var(--shadow)}
article.post h1{font:600 1.7rem/1.22 var(--font-ui);margin:.2em 0}
article.post .body{max-width:72ch;font-size:1.02rem}
article.post img{max-width:100%;height:auto;border-radius:6px}
article.post blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid var(--line);background:var(--paper)}
.note{background:#fbf3e3;border:1px solid #e3cf9e;border-radius:8px;padding:10px 12px;margin:10px 0}

/* Selected & export */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
ul.picked{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:340px;overflow:auto}
ul.picked li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 2px}
ul.picked .x{border:0;background:none;color:var(--accent);cursor:pointer;font-size:1.25rem;line-height:1;padding:0 4px}
.opts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.opts label{display:flex;align-items:center;gap:7px;font-size:.92rem;cursor:pointer}
.opts input{accent-color:var(--accent);width:16px;height:16px}
#list-title{max-width:420px}
.fmt{display:flex;flex-wrap:wrap;gap:6px}
.fmt .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#preview-html{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--paper);max-height:430px;overflow:auto;overflow-wrap:anywhere}
#preview-text{width:100%;height:330px;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
#export-status{color:var(--accent);font-weight:600}
.prose{max-width:68ch}
.prose h3{font:600 1.05rem/1.3 var(--font-ui);margin:20px 0 4px}
.prose p{margin:0 0 10px}
</style>
</head>
<body>
<div class="sticky-top" id="sticky-top">
<header class="top"><div class="wrap brand">
  <div class="brand-row">
    <h1>Reciprocal Knowledge Library</h1>
    <div class="stats" id="stats"></div>
  </div>
  <p id="subtitle">The writing of Jeff Kisling, 2015 to today: channels into knowledge, reciprocity and extraction, and what happened between Quakers and Indigenous peoples. New writing appears at <a href="https://channelsintoknowledge.com/">Channels Into Knowledge</a>.</p>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap tablist" role="tablist">
  <a class="tab" href="start-here.html">Start here</a>
  <button class="tab" role="tab" id="tab-search" aria-selected="true">Search</button>
  <button class="tab" role="tab" id="tab-export" aria-selected="false" tabindex="-1">Selected &amp; export <span class="count-pill" id="sel-count">0</span></button>
  <button class="tab" role="tab" id="tab-about" aria-selected="false" tabindex="-1">About</button>
</div></nav>
</div>
<main class="wrap" id="main"><p>Loading the library&hellip;</p></main>
<script>
(function(){
"use strict";
var C=null, TEXT={}, PAGE=40, VIEW="search";
var S={sec:"",q:"",blogs:[],age:"",full:false,shown:PAGE};
var SEL=[], FMT="html", KEY="rk-export-v1";
var COLORS=["#c98a6b","#6b9ac9","#8fb07a","#b58cc4","#d4b25e","#6fb8b0","#5f8a7d","#c47a8e"];
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function ageLabel(p){return p.ag<0?"Not rated":p.ag===0?"All ages":"Ages "+p.ag+"+";}
function chunkKey(p){var a=p.p.split("/");return a[0]+"-"+a[1];}
function blogColor(i){return COLORS[i%COLORS.length];}

try{ SEL=JSON.parse(localStorage.getItem(KEY)||"[]")||[]; }catch(e){ SEL=[]; }
function saveSel(){ try{ localStorage.setItem(KEY,JSON.stringify(SEL)); }catch(e){} }
function picked(path){ return SEL.indexOf(path)>=0; }
function pick(path,on){ var i=SEL.indexOf(path); if(on&&i<0) SEL.push(path); if(!on&&i>=0) SEL.splice(i,1); saveSel(); syncCount(); }
function selPosts(){ var by={}; C.posts.forEach(function(p){by[p.p]=p;});
  return SEL.map(function(x){return by[x];}).filter(Boolean).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;}); }
function syncCount(){ $("sel-count").textContent=SEL.length; }

function loadChunk(key){
  if(TEXT[key]) return Promise.resolve(TEXT[key]);
  if(C.text.indexOf(key)<0) return Promise.resolve(null);
  return fetch("text-"+key+".json").then(function(r){return r.ok?r.json():null;}).then(function(j){TEXT[key]=j||{};return j;}).catch(function(){return null;});
}

/* ---------- search terms: all words must appear, "a phrase", -minus ---------- */
function parseQuery(q){
  var pos=[], neg=[], re=/"([^"]+)"|(\S+)/g, m;
  while((m=re.exec(q))){
    var t=(m[1]||m[2]).toLowerCase(), out=false;
    if(!m[1]&&t.charAt(0)==="-"){ out=true; t=t.slice(1); }
    if(!t) continue;
    (out?neg:pos).push(t);
  }
  return {pos:pos,neg:neg};
}
function rxEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function highlight(text,terms){
  var h=esc(text); if(!terms.length) return h;
  try{ h=h.replace(new RegExp("("+terms.map(rxEsc).join("|")+")","gi"),"<mark>$1</mark>"); }catch(e){}
  return h;
}

/* ---------- markdown for the reader (escaped first, so posts can't inject HTML) ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,function(m,a,u){return /^https?:/.test(u)?'<img loading="lazy" alt="'+a+'" src="'+u+'">':"";});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,function(m,a,u){return /^(https?:|mailto:)/.test(u)?'<a href="'+u+'" target="_blank" rel="noopener">'+a+"</a>":a;});
  s=s.replace(/\[\^[^\]]+\]/g,"");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/(^|[\s(])_([^_\n]+)_/g,"$1<em>$2</em>");
  s=s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  var out=[], lines=src.replace(/\r/g,"").split("\n"), i=0, para=[];
  function flush(){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } }
  while(i<lines.length){
    var l=lines[i], m;
    if(/^\s*$/.test(l)){ flush(); i++; continue; }
    if((m=/^(#{1,6})\s+(.*)$/.exec(l))){ flush(); var hh=Math.min(6,m[1].length+1); out.push("<h"+hh+">"+inline(m[2])+"</h"+hh+">"); i++; continue; }
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){ flush(); out.push("<hr>"); i++; continue; }
    if(/^\[\^[^\]]+\]:/.test(l)){ flush(); i++; continue; }
    if(/^>/.test(l)){ flush(); var q=[]; while(i<lines.length && /^>/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,"")); i++; } out.push("<blockquote>"+md(q.join("\n"))+"</blockquote>"); continue; }
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){ flush(); var ord=/^\s*\d/.test(l), items=[];
      while(i<lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))){
        if(/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,"")); else items[items.length-1]+=" "+lines[i].trim(); i++; }
      out.push((ord?"<ol>":"<ul>")+items.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+(ord?"</ol>":"</ul>")); continue; }
    para.push(l.trim()); i++;
  }
  flush(); return out.join("\n");
}

/* ---------- the address bar holds the view ---------- */
function readHash(){
  var h=decodeURIComponent(location.hash.replace(/^#/,"")), o={};
  h.split("&").forEach(function(kv){var i=kv.indexOf("="); if(i>0) o[kv.slice(0,i)]=kv.slice(i+1);});
  return o;
}
function searchHash(push){
  var parts=[]; if(S.sec) parts.push("s="+S.sec); if(S.q) parts.push("q="+encodeURIComponent(S.q));
  if(S.blogs.length) parts.push("b="+S.blogs.join(",")); if(S.age) parts.push("a="+S.age); if(S.full) parts.push("f=1");
  var h="#"+parts.join("&");
  if(push) location.hash=h; else history.replaceState(null,"",h||"#");
}

/* ---------- matching ---------- */
function matches(){
  var Q=parseQuery(S.q), si=-1;
  C.sections.forEach(function(s,i){ if(s.id===S.sec) si=i; });
  var res=C.posts.filter(function(p){
    if(si>=0 && p.c.indexOf(si)<0) return false;
    if(S.blogs.length && S.blogs.indexOf(p.b)<0) return false;
    if(S.age!=="" && !(p.ag>=0 && p.ag<=+S.age)) return false;
    if(!Q.pos.length && !Q.neg.length) return true;
    if(!p._h) p._h=(p.t+" "+p.s+" "+p.g.join(" ")).toLowerCase();
    var body=""; if(S.full){ var c=TEXT[chunkKey(p)]; if(c&&c[p.p]) body=p._b||(p._b=c[p.p].toLowerCase()); }
    var hay=p._h+" "+body;
    for(var i=0;i<Q.neg.length;i++) if(hay.indexOf(Q.neg[i])>=0) return false;
    for(var j=0;j<Q.pos.length;j++) if(hay.indexOf(Q.pos[j])<0) return false;
    return true;
  });
  res._terms=Q.pos;
  return res;
}

/* ---------- tabs ---------- */
function setTab(v){
  VIEW=v;
  ["search","export","about"].forEach(function(k){
    var b=$("tab-"+k), on=(k===v);
    b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1;
  });
}
$("tab-search").addEventListener("click",function(){ searchHash(true); if(location.hash===""||location.hash==="#") route(); });
$("tab-export").addEventListener("click",function(){ location.hash="#t=export"; });
$("tab-about").addEventListener("click",function(){ location.hash="#t=about"; });

/* ---------- search panel ---------- */
function sectionList(){
  var counts=C.sections.map(function(){return 0;});
  C.posts.forEach(function(p){p.c.forEach(function(i){counts[i]++;});});
  var h='<button class="check" data-s="" aria-current="'+(S.sec===""?"true":"false")+'"><span>All posts</span><span class="n">'+num(C.posts.length)+"</span></button>", parent=null;
  C.sections.forEach(function(s,i){
    if(s.parent&&s.parent!==parent) h+='<div class="subhead">'+esc(s.parent)+"</div>";
    parent=s.parent;
    h+='<button class="check'+(s.parent?" sub":"")+'" data-s="'+s.id+'" aria-current="'+(S.sec===s.id?"true":"false")+'"><span>'+esc(s.title)+'</span><span class="n">'+num(counts[i])+"</span></button>";
  });
  return h;
}
function blogList(){
  var counts=C.blogs.map(function(){return 0;});
  C.posts.forEach(function(p){counts[p.b]++;});

/* ---------- Selected & export ---------- */
function opts(){ var g=function(id){return $(id).checked;};
  return {sum:g("opt-summary"),meta:g("opt-meta"),tags:g("opt-tags"),sec:g("opt-sections"),age:g("opt-age"),num:g("opt-num"),
          title:$("list-title").value.trim()||"Reading list"}; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mdEsc(s){ return String(s).replace(/([\[\]])/g,"\\$1"); }
function csvCell(s){ s=String(s==null?"":s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function secNames(p){ return p.c.map(function(i){return C.sections[i].title;}).join(", "); }
function buildExport(fmt){
  var o=opts(), list=selPosts(), n=list.length;
  var note="Exported "+today()+" from the Reciprocal Knowledge Library, the writing of Jeff Kisling. "+n+" "+(n===1?"post":"posts")+".";
  if(fmt==="csv"){
    var head=["Title","URL"]; if(o.meta) head.push("Blog","Date"); if(o.age) head.push("Age rating","Themes");
    if(o.sec) head.push("Sections"); if(o.tags) head.push("Tags"); if(o.sum) head.push("Summary");
    var rows=[head.join(",")];
    list.forEach(function(p){
      var r=['=HYPERLINK("'+String(p.u).replace(/"/g,"%22")+'","'+String(p.t).slice(0,250).replace(/"/g,'""')+'")',p.u];
      if(o.meta) r.push(C.blogs[p.b].name,p.d);
      if(o.age) r.push(ageLabel(p),(p.th||[]).join("; "));
      if(o.sec) r.push(secNames(p)); if(o.tags) r.push((p.g||[]).join("; ")); if(o.sum) r.push(p.s||"");
      rows.push(r.map(csvCell).join(","));
    });
    return rows.join("\n");
  }
  if(fmt==="md"){
    var m="# "+o.title+"\n\n_"+note+"_\n\n";
    list.forEach(function(p,i){
      var bullet=o.num?(i+1)+". ":"- ", pad=o.num?"   ":"  ";
      m+=bullet+"["+mdEsc(p.t)+"]("+p.u+")";
      if(o.meta) m+=" | "+C.blogs[p.b].name+", "+p.d;
      if(o.age) m+=" | "+ageLabel(p)+(p.th&&p.th.length?" (includes: "+p.th.join(", ")+")":"");
      m+="\n"+pad+"<"+p.u+">\n";
      if(o.sum&&p.s) m+=pad+p.s+"\n";
      if(o.sec&&p.c.length) m+=pad+"Sections: "+secNames(p)+"\n";
      if(o.tags&&p.g.length) m+=pad+"Tags: "+p.g.join(", ")+"\n";
      m+="\n";
    });
    return m.trim()+"\n";
  }
  if(fmt==="txt"){
    var t=o.title+"\n"+note+"\n\n";
    list.forEach(function(p,i){
      t+=(o.num?(i+1)+". ":"")+p.t+"\n";
      if(o.meta) t+=C.blogs[p.b].name+", "+p.d+"\n";
      if(o.age) t+=ageLabel(p)+(p.th&&p.th.length?". Includes: "+p.th.join(", "):"")+"\n";
      t+=p.u+"\n";
      if(o.sum&&p.s) t+=p.s+"\n";
      if(o.sec&&p.c.length) t+="Sections: "+secNames(p)+"\n";
      if(o.tags&&p.g.length) t+="Tags: "+p.g.join(", ")+"\n";
      t+="\n";
    });
    return t.trim()+"\n";
  }
  var tag=o.num?"ol":"ul", h="<h2>"+esc(o.title)+"</h2>\n<p><em>"+esc(note)+"</em></p>\n<"+tag+">\n";
  list.forEach(function(p){
    h+='<li><a href="'+esc(p.u)+'">'+esc(p.t)+"</a>";
    if(o.meta) h+=" ("+esc(C.blogs[p.b].name)+", "+p.d+")";
    if(o.age) h+=" <strong>"+esc(ageLabel(p))+"</strong>"+(p.th&&p.th.length?' <span style="font-size:90%">(includes: '+esc(p.th.join(", "))+")</span>":"");
    h+='<br><a href="'+esc(p.u)+'" style="font-size:90%">'+esc(p.u)+"</a>";
    if(o.sum&&p.s) h+="<p>"+esc(p.s)+"</p>";
    if(o.sec&&p.c.length) h+='<p style="font-size:90%">Sections: '+esc(secNames(p))+"</p>";
    if(o.tags&&p.g.length) h+='<p style="font-size:90%">Tags: '+esc(p.g.join(", "))+"</p>";
    h+="</li>\n";
  });
  return h+"</"+tag+">\n";
}
function flash(msg){ var el=$("export-status"); el.textContent=msg; clearTimeout(el._t); el._t=setTimeout(function(){el.textContent="";},4000); }
function renderExport(){
  var has=SEL.length>0, out=has?buildExport(FMT):"";
  $("copy").disabled=!has; $("download").disabled=!has;
  if(FMT==="html"){ $("preview-html").hidden=false; $("preview-text").hidden=true;
    $("preview-html").innerHTML=has?out.replace(/<a /g,'<a target="_blank" rel="noopener" '):'<p style="color:var(--ink-3)">Your export will appear here.</p>'; }
  else { $("preview-html").hidden=true; $("preview-text").hidden=false; $("preview-text").value=out; }
}
function copyExport(){
  var out=buildExport(FMT);
  if(FMT==="html"){
    var plain=buildExport("txt");
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([out],{type:"text/html"}),"text/plain":new Blob([plain],{type:"text/plain"})})])
        .then(function(){flash("Copied with working links. Paste it into an email or document.");},selectRendered);
    } else selectRendered();
    return;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(function(){flash("Copied.");},copyTextarea);
  else copyTextarea();
}
function copyTextarea(){ var ta=$("preview-text"); ta.focus(); ta.select(); var ok=false; try{ok=document.execCommand("copy");}catch(e){}
  flash(ok?"Copied.":"Press Ctrl+C or Cmd+C to copy the selected text."); }
function selectRendered(){ var r=document.createRange(); r.selectNodeContents($("preview-html"));
  var sl=window.getSelection(); sl.removeAllRanges(); sl.addRange(r); var ok=false; try{ok=document.execCommand("copy");}catch(e){}
  if(ok){ sl.removeAllRanges(); flash("Copied with working links. Paste it into an email or document."); }
  else flash("Press Ctrl+C or Cmd+C to copy the selected list."); }
function downloadExport(){
  var map={html:["html","text/html"],md:["md","text/markdown"],txt:["txt","text/plain"],csv:["csv","text/csv"]}[FMT];
  var body=buildExport(FMT);
  if(FMT==="html") body='<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><title>'+esc(opts().title)+'</title></head>\n<body style="font-family:Arial,Helvetica,sans-serif;max-width:760px;margin:2em auto;padding:0 1em;line-height:1.5">\n'+body+"</body></html>\n";
  var name=(opts().title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"reading-list")+"."+map[0];
  try{
    var url=URL.createObjectURL(new Blob([body],{type:map[1]+";charset=utf-8"}));
    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    flash("Downloading "+name+". If nothing downloads, use Copy instead.");
  }catch(e){ flash("This browser could not save the file. Use Copy instead."); }
}

   +"<h3>How it is organized</h3>"

   +"<ul>"+C.sections.map(function(s,i){return "<li><strong>"+esc(s.title)+"</strong> — "+esc(s.about.split(". ")[0])+". "+num(counts[i])+" posts.</li>";}).join("")+"</ul>"
   +"<h3>What was made by a machine</h3>"

   +"<h3>Older language</h3>"
   +"<p>Posts keep the words Jeff used when he wrote them. His current writing uses <em>reciprocity</em> and <em>extraction</em>, and <em>active objection</em>.</p>"
   +'<h3>Elsewhere</h3><p><a href="https://channelsintoknowledge.com/">Channels Into Knowledge</a> · <a href="https://kislingjeff-oss.github.io/JAKPublicBlogDatabase/desk/#search">Journal Research Desk</a></p>'
   +"<p class=\"hint\">Catalog built "+esc(C.generated)+".</p></div>";
  window.scrollTo(0,0);
}

/* ---------- routing ---------- */
function route(){
  var h=readHash();
  if(h.p){ setTab("search"); drawPost(h.p); return; }
  if(h.t==="export"){ setTab("export"); drawExport(); return; }
  if(h.t==="about"){ setTab("about"); drawAbout(); return; }
  S.sec=h.s||""; S.q=h.q||""; S.age=h.a||"";
  S.blogs=h.b?h.b.split(",").map(Number).filter(function(n){return n===-1||(n>=0&&n<C.blogs.length);}):[];
  if(S.blogs.length===C.blogs.length) S.blogs=[]; S.full=h.f==="1"&&Object.keys(TEXT).length>0;
  setTab("search"); drawSearch();
}
function measureTop(){
  var el=$("sticky-top");
  document.documentElement.style.setProperty("--top",el.getBoundingClientRect().height+"px");
}
(function stickyHeader(){
  var el=$("sticky-top"), ticking=false;
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      var want=window.scrollY>90;
      if(want!==el.classList.contains("scrolled")){
        el.classList.toggle("scrolled",want);
        measureTop(); setTimeout(measureTop,180);   /* again once the size transition has finished */
      }
      ticking=false;
    });
  }
  window.addEventListener("scroll",onScroll,{passive:true});
  window.addEventListener("resize",measureTop);
  measureTop();
})();
fetch("catalog.json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
  C=j; if(!C.text) C.text=[];
  $("stats").innerHTML='<div class="stat" data-label="posts"><b>'+num(C.posts.length)+"</b><span>posts</span></div>"
    +'<div class="stat" data-label="blogs"><b>'+C.blogs.length+"</b><span>blogs</span></div>"
    +'<div class="stat" data-label="sections"><b>'+C.sections.length+"</b><span>sections</span></div>";
  measureTop();
  syncCount();
  window.addEventListener("hashchange",route); route();
}).catch(function(){
  $("main").innerHTML='<div class="empty-state"><p><b>The library could not load its catalog.</b></p><p>If you opened this page straight from a folder on your computer, the browser blocks it from reading the files beside it. Open the published site instead, or search the bundle in Obsidian.</p></div>';
});
})();
</script>
