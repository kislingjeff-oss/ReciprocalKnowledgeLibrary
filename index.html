<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reciprocal Knowledge Library</title>
<meta name="description" content="The library of Jeff Kisling's writing: channels into knowledge, reciprocity and extraction, Quakers and Indigenous peoples. Every blog post since 2015, searchable, with full text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3fc;--panel:#fff;--ink:#0a2038;--soft:#35506b;--accent:#0a56a6;--accent-ink:#fff;--line:#9cc4e8;--tint:#d3e8fa;--warn:#8a4b00}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif}
a{color:var(--accent)}
header{background:var(--accent);color:var(--accent-ink);padding:18px 16px}
header .in{max-width:1180px;margin:0 auto}
header h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
header p{margin:6px 0 0;max-width:70ch}
header a{color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:290px 1fr;gap:20px}
nav{align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px}
nav h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:12px 8px 4px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink);padding:7px 8px;border-radius:6px;cursor:pointer}
nav button:hover{background:var(--tint)}
nav button[aria-current="true"]{background:var(--accent);color:#fff;font-weight:600}
nav button .n{font-variant-numeric:tabular-nums;opacity:.8;font-size:.86rem}
nav .sub{padding-left:18px}
main{min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px}
.bar input[type=search]{flex:1 1 240px;min-width:0;font:inherit;padding:9px 11px;border:2px solid var(--accent);border-radius:8px;color:var(--ink)}
.bar select{font:inherit;padding:8px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
.bar label{display:flex;align-items:center;gap:6px;font-size:.92rem}
.about{margin:14px 2px 6px}
.about h2{margin:0 0 2px;font-size:1.3rem}
.about p{margin:0;color:var(--soft);max-width:75ch}
.count{margin:8px 2px;font-weight:600}
ul.posts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.posts li{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:8px;padding:10px 12px}
ul.posts a.t{font-weight:600;font-size:1.06rem;text-decoration:none}
ul.posts a.t:hover{text-decoration:underline}
.meta{font-size:.86rem;color:var(--soft)}
.sum{margin:4px 0 0;overflow-wrap:anywhere}
.chip{display:inline-block;background:var(--tint);border-radius:99px;padding:1px 9px;font-size:.8rem;margin:4px 4px 0 0;color:var(--ink)}
.chip.w{background:#ffe9c7;color:var(--warn)}
.more{margin:14px 0;padding:10px 18px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
article{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:20px;overflow-wrap:anywhere}
article h1{font-size:1.7rem;line-height:1.2;margin:.2em 0}
article img{max-width:100%;height:auto}
article blockquote{margin:1em 0;padding:.2em 1em;border-left:5px solid var(--line);background:var(--bg)}
article .body{max-width:72ch}
.back{font:inherit;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.note{background:#fff7e6;border:1px solid #e0b25c;border-radius:8px;padding:10px 12px;margin:10px 0}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:none}}
</style>
</head>
<body>
<header><div class="in">
<h1>Reciprocal Knowledge Library</h1>
<p>The writing of Jeff Kisling, 2015 to today: channels into knowledge, reciprocity and extraction, and what happened between Quakers and Indigenous peoples. New writing appears at <a href="https://channelsintoknowledge.com/">Channels Into Knowledge</a>.</p>
</div></header>
<div class="wrap">
<nav id="nav" aria-label="Sections"></nav>
<main id="main"><p>Loading the library…</p></main>
</div>
<script>
(function(){
"use strict";
var C=null, S={sec:"",q:"",blog:"",age:"",full:false,shown:40}, TEXT={}, PAGE=40;
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ageLabel(p){return p.ag<0?"":p.ag===0?"All ages":"Ages "+p.ag+"+";}
function chunkKey(p){var a=p.p.split("/");return a[0]+"-"+a[1];}

function loadChunk(key){
  if(TEXT[key]) return Promise.resolve(TEXT[key]);
  if(C.text.indexOf(key)<0) return Promise.resolve(null);
  return fetch("text-"+key+".json").then(function(r){return r.ok?r.json():null;}).then(function(j){TEXT[key]=j||{};return j;}).catch(function(){return null;});
}

/* ---- small markdown renderer: text is escaped first, so nothing in a post runs as HTML ---- */
function inline(s){
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,function(m,a,u){return /^https?:/.test(u)?'<img loading="lazy" alt="'+a+'" src="'+u+'">':"";});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,function(m,a,u){return /^(https?:|mailto:)/.test(u)?'<a href="'+u+'" target="_blank" rel="noopener">'+a+"</a>":a;});
  s=s.replace(/\[\^[^\]]+\]/g,"");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/(^|[\s(])_([^_\n]+)_/g,"$1<em>$2</em>");
  s=s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  var out=[], lines=src.replace(/\r/g,"").split("\n"), i=0, para=[];
  function flush(){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } }
  while(i<lines.length){
    var l=lines[i], m;
    if(/^\s*$/.test(l)){ flush(); i++; continue; }
    if((m=/^(#{1,6})\s+(.*)$/.exec(l))){ flush(); var h=Math.min(6,m[1].length+1); out.push("<h"+h+">"+inline(m[2])+"</h"+h+">"); i++; continue; }
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){ flush(); out.push("<hr>"); i++; continue; }
    if(/^\[\^[^\]]+\]:/.test(l)){ flush(); i++; continue; }
    if(/^>/.test(l)){ flush(); var q=[]; while(i<lines.length && /^>/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,"")); i++; } out.push("<blockquote>"+md(q.join("\n"))+"</blockquote>"); continue; }
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){ flush(); var ord=/^\s*\d/.test(l), items=[];
      while(i<lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))){
        if(/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,"")); else items[items.length-1]+=" "+lines[i].trim(); i++; }
      out.push((ord?"<ol>":"<ul>")+items.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+(ord?"</ol>":"</ul>")); continue; }
    para.push(l.trim()); i++;
  }
  flush(); return out.join("\n");
}

/* ---- state in the address bar ---- */
function readHash(){
  var h=decodeURIComponent(location.hash.replace(/^#/,"")), o={};
  h.split("&").forEach(function(kv){var i=kv.indexOf("="); if(i>0) o[kv.slice(0,i)]=kv.slice(i+1);});
  return o;
}
function setHash(o){
  var parts=[]; for(var k in o) if(o[k]) parts.push(k+"="+encodeURIComponent(o[k]));
  location.hash=parts.join("&");
}
function listHash(){ setHash({s:S.sec,q:S.q,b:S.blog,a:S.age,f:S.full?"1":""}); }

/* ---- navigation ---- */
function drawNav(){
  var counts=C.sections.map(function(){return 0;});
  C.posts.forEach(function(p){p.c.forEach(function(i){counts[i]++;});});
  var h='<button data-s="" aria-current="'+(S.sec===""?"true":"false")+'"><span>All posts</span><span class="n">'+C.posts.length+'</span></button><h2>Sections</h2>', parent=null;
  C.sections.forEach(function(s,i){
    if(s.parent && s.parent!==parent){ h+="<h2>"+esc(s.parent)+"</h2>"; }
    if(!s.parent && parent){ h+="<h2>&nbsp;</h2>"; }
    parent=s.parent;
    h+='<div class="'+(s.parent?"sub":"")+'"><button data-s="'+s.id+'" aria-current="'+(S.sec===s.id?"true":"false")+'"><span>'+esc(s.title)+'</span><span class="n">'+counts[i]+"</span></button></div>";
  });
  $("nav").innerHTML=h;
}
$("nav").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  S.sec=b.getAttribute("data-s"); S.shown=PAGE; listHash();
});

/* ---- list ---- */
function matches(){
  var terms=S.q.toLowerCase().split(/\s+/).filter(Boolean), si=-1;
  C.sections.forEach(function(s,i){ if(s.id===S.sec) si=i; });
  return C.posts.filter(function(p){
    if(si>=0 && p.c.indexOf(si)<0) return false;
    if(S.blog!=="" && p.b!==+S.blog) return false;
    if(S.age!=="" && !(p.ag>=0 && p.ag<=+S.age)) return false;
    if(!terms.length) return true;
    if(!p._h) p._h=(p.t+" "+p.s+" "+p.g.join(" ")).toLowerCase();
    var body=""; if(S.full){ var c=TEXT[chunkKey(p)]; body=c&&c[p.p]?(p._b||(p._b=c[p.p].toLowerCase())):""; }
    return terms.every(function(t){ return p._h.indexOf(t)>=0 || (body && body.indexOf(t)>=0); });
  });
}
function drawList(){
  var sec=null; C.sections.forEach(function(s){ if(s.id===S.sec) sec=s; });
  var res=matches(), h='<div class="bar"><input type="search" id="q" placeholder="Search titles, summaries and tags" value="'+esc(S.q)+'" aria-label="Search">';
  h+='<select id="blog" aria-label="Blog"><option value="">All eight blogs</option>'+C.blogs.map(function(b,i){return '<option value="'+i+'"'+(S.blog===String(i)?" selected":"")+">"+esc(b.name)+"</option>";}).join("")+"</select>";
  h+='<select id="age" aria-label="Age"><option value="">Any age rating</option>'+[[0,"Rated for all ages"],[12,"Rated for ages 12 and up, or younger"],[14,"Rated for ages 14 and up, or younger"],[16,"Rated for ages 16 and up, or younger"]].map(function(a){return '<option value="'+a[0]+'"'+(S.age===String(a[0])?" selected":"")+">"+a[1]+"</option>";}).join("")+"</select>";
  h+='<label><input type="checkbox" id="full"'+(S.full?" checked":"")+(C.text.length?"":" disabled")+"> Search the full text too</label></div>";
  h+='<div class="about"><h2>'+esc(sec?sec.title:"All posts")+"</h2><p>"+esc(sec?sec.about:"Every post from eight blogs, newest first. Choose a section on the left, or search.")+"</p></div>";
  h+='<p class="count" id="count">'+res.length+" post"+(res.length===1?"":"s")+"</p><ul class=\"posts\">";
  res.slice(0,S.shown).forEach(function(p){
    h+='<li><a class="t" href="#p='+encodeURIComponent(p.p)+'">'+esc(p.t)+'</a><div class="meta">'+p.d+" · "+esc(C.blogs[p.b].name)+"</div>";
    if(p.s) h+='<p class="sum">'+esc(p.s)+"</p>";
    var a=ageLabel(p); if(a) h+='<span class="chip">'+a+"</span>";
    p.th.forEach(function(t){h+='<span class="chip w">'+esc(t)+"</span>";});
    h+="</li>";
  });
  h+="</ul>"; if(res.length>S.shown) h+='<button class="more" id="more">Show more</button>';
  $("main").innerHTML=h;
  var q=$("q"), timer;
  q.addEventListener("input",function(){ clearTimeout(timer); timer=setTimeout(function(){ S.q=q.value; S.shown=PAGE; history.replaceState(null,"","#"+["s="+S.sec,"q="+encodeURIComponent(S.q),"b="+S.blog,"a="+S.age,"f="+(S.full?"1":"")].join("&")); var pos=q.selectionStart; drawList(); $("q").focus(); try{$("q").setSelectionRange(pos,pos);}catch(e){} },250); });
  $("blog").addEventListener("change",function(e){S.blog=e.target.value;S.shown=PAGE;listHash();});
  $("age").addEventListener("change",function(e){S.age=e.target.value;S.shown=PAGE;listHash();});
  $("full").addEventListener("change",function(e){
    S.full=e.target.checked; if(!S.full){ listHash(); return; }
    $("count").textContent="Loading the full text of every post…";
    Promise.all(C.text.map(loadChunk)).then(function(){ listHash(); drawList(); });
  });
  if($("more")) $("more").addEventListener("click",function(){S.shown+=PAGE;drawList();});
}

/* ---- reader ---- */
function drawPost(path){
  var p=null; C.posts.forEach(function(x){ if(x.p===path) p=x; });
  if(!p){ $("main").innerHTML="<p>That post is not in the library.</p>"; return; }
  var head='<p><button class="back" id="back">← Back to the list</button></p><article><div class="meta">'+p.d+" · "+esc(C.blogs[p.b].name)+(p.u?' · <a href="'+esc(p.u)+'" target="_blank" rel="noopener">Original post</a>':"")+"</div><h1>"+esc(p.t)+"</h1>";
  var chips=p.c.map(function(i){return '<a class="chip" href="#s='+C.sections[i].id+'">'+esc(C.sections[i].title)+"</a>";}).join("")+p.g.map(function(g){return '<span class="chip">'+esc(g)+"</span>";}).join("");
  if(ageLabel(p)) chips='<span class="chip">'+ageLabel(p)+"</span>"+chips;
  if(p.th.length) head+='<div class="note">This post includes: '+esc(p.th.join(", "))+".</div>";
  $("main").innerHTML=head+'<div class="body" id="body"><p>Loading…</p></div><p>'+chips+"</p></article>";
  $("back").addEventListener("click",function(){ if(history.length>1) history.back(); else listHash(); });
  window.scrollTo(0,0);
  loadChunk(chunkKey(p)).then(function(c){
    var body=c&&c[p.p];
    if(body){
      body=body.replace(/^\s*#\s+.*\n+/,"").replace(/^\s*\*[^*\n]*\*\s*·\s*\[Original post\][^\n]*\n+/,"");
      $("body").innerHTML=md(body);
    } else {
      $("body").innerHTML="<p>"+esc(p.s)+'</p><div class="note">The full text of this post is not loaded here yet.'+(p.u?' <a href="'+esc(p.u)+'" target="_blank" rel="noopener">Read it where it was published.</a>':"")+"</div>";
    }
  });
}

function route(){
  var h=readHash();
  if(h.p){ drawNav(); drawPost(h.p); return; }
  S.sec=h.s||""; S.q=h.q||""; S.blog=h.b||""; S.age=h.a||""; S.full=h.f==="1"&&Object.keys(TEXT).length>0;
  drawNav(); drawList();
}
fetch("catalog.json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
  C=j; if(!C.text) C.text=[]; window.addEventListener("hashchange",route); route();
}).catch(function(){
  $("main").innerHTML='<div class="note"><strong>The library could not load its catalog.</strong> If you opened this page straight from a folder on your computer, the browser blocks it from reading the files beside it. Open the published site instead, or search the bundle in Obsidian.</div>';
});
})();
</script>
</body>
</html>
